services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-sample}
      NEIS_BASE_URL: ${NEIS_BASE_URL:-https://open.neis.go.kr}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4173}
      SCHOOL_PAGE_SIZE: ${SCHOOL_PAGE_SIZE:-100}
      SCHOOL_RESULT_LIMIT: ${SCHOOL_RESULT_LIMIT:-100}
      MEAL_MAX_RANGE_DAYS: ${MEAL_MAX_RANGE_DAYS:-31}
      NEIS_CONNECT_TIMEOUT: ${NEIS_CONNECT_TIMEOUT:-3}
      NEIS_READ_TIMEOUT: ${NEIS_READ_TIMEOUT:-10}
      NEIS_MAX_RETRIES: ${NEIS_MAX_RETRIES:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4173}:4173"

  mcp:
    build:
      context: .
      dockerfile: src/mcp/Dockerfile
    environment:
      NEIS_API_KEY: ${NEIS_API_KEY:-sample}
      NEIS_BASE_URL: ${NEIS_BASE_URL:-https://open.neis.go.kr}
      MCP_PORT: ${MCP_PORT:-8080}
      SCHOOL_PAGE_SIZE: ${SCHOOL_PAGE_SIZE:-100}
      SCHOOL_RESULT_LIMIT: ${SCHOOL_RESULT_LIMIT:-100}
      MEAL_MAX_RANGE_DAYS: ${MEAL_MAX_RANGE_DAYS:-31}
      NEIS_CONNECT_TIMEOUT: ${NEIS_CONNECT_TIMEOUT:-3}
      NEIS_READ_TIMEOUT: ${NEIS_READ_TIMEOUT:-10}
      NEIS_MAX_RETRIES: ${NEIS_MAX_RETRIES:-2}
    ports:
      - "${MCP_PORT:-8080}:8080"
