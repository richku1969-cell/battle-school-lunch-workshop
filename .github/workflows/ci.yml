name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci
      - name: Build
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm run build --if-present
      - name: Test
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm test --if-present
      - name: Await frontend scaffold
        if: ${{ hashFiles('frontend/package-lock.json') == '' }}
        run: echo "frontend/package-lock.json is not present yet; skipping TypeScript checks."

  backend:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements*.txt
      - name: Install dependencies
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Test
        if: ${{ hashFiles('backend/pyproject.toml') != '' }}
        working-directory: backend
        run: pytest
      - name: Await backend scaffold
        if: ${{ hashFiles('backend/pyproject.toml') == '' }}
        run: echo "backend/pyproject.toml is not present yet; skipping Python checks."

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') != '' }}
        run: docker compose config
      - name: Await Compose scaffold
        if: ${{ hashFiles('compose.yml', 'compose.yaml', 'docker-compose.yml', 'docker-compose.yaml') == '' }}
        run: echo "No Compose file is present yet; skipping configuration validation."

  deploy:
    name: Azure Deploy
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - compose
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify Azure deployment scaffold
        id: deployment_scaffold
        shell: bash
        run: |
          if [[ -f azure.yaml && -d infra ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Azure Developer CLI
        if: ${{ steps.deployment_scaffold.outputs.ready == 'true' }}
        uses: Azure/setup-azd@v2
      - name: Log in to Azure
        if: ${{ steps.deployment_scaffold.outputs.ready == 'true' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy application
        if: ${{ steps.deployment_scaffold.outputs.ready == 'true' }}
        env:
          AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
        run: azd up --no-prompt
      - name: Await Azure deployment scaffold
        if: ${{ steps.deployment_scaffold.outputs.ready != 'true' }}
        run: echo "azure.yaml and infra/ are not present yet; skipping Azure deployment."
